<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.js"></script>
    <title>World Clock - Zahra Razzaghi</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>
      <select name="" id="city">
        <option value="">Select a city...</option>
        <option value="current">My current location</option>
        <option value="Asia/Tokyo">Tokyo 🇯🇵</option>
        <option value="Africa/Harare">Harare 🇿🇼</option>
        <option value="Europe/Rome">Rome 🇮🇹</option>
        <option value="Pacific/Samoa">Samoa 🇼🇸</option>
        <option value="America/New_York">New York</option>
      </select>
      <div id="cities">
        <div class="city" id="maseru">
          <div class="city-date">
            <h2 class="name-of-city" id="maseru">Maseru 🇱🇸</h2>
            <div class="date-of-city" id="maseru-date"></div>
          </div>
          <div class="time-of-city">
            <span id="maseru-time"></span>
            <span class="meridiem-markers" id="maseru-marker"></span>
          </div>
        </div>

        <div class="city" id="fiji">
          <div class="city-date">
            <h2 class="name-of-city" id="fiji">Fiji 🇫🇯</h2>
            <div class="date-of-city" id="fiji-date"></div>
          </div>
          <div class="time-of-city">
            <span id="fiji-time"></span>
            <span class="meridiem-markers" id="fiji-marker"></span>
          </div>
        </div>

        <div class="city" id="tokyo">
          <div class="city-date">
            <h2 class="name-of-city" id="tokyo">Tokyo 🇯🇵</h2>
            <div class="date-of-city" id="tokyo-date"></div>
          </div>
          <div class="time-of-city">
            <span id="tokyo-time"></span>
            <span class="meridiem-markers" id="tokyo-marker"></span>
          </div>
        </div>

        <div class="city" id="paris">
          <div class="city-date">
            <h2 class="name-of-city" id="paris">Paris 🇫🇷</h2>
            <div class="date-of-city" id="paris-date"></div>
          </div>
          <div class="time-of-city">
            <span id="paris-time"></span>
            <span class="meridiem-markers" id="paris-marker"></span>
          </div>
        </div>
      </div>
    </div>
    <footer>
      This website was coded by<strong>
        <a href="https://github.com/zahrarazzaghi96" target="_blank"
          >Zahra Razzaghi</a
        ></strong
      >
      <a href="https://github.com/zahrarazzaghi96" target="_blank"
        >Zahra Razzaghi</a
      >
      and is open-sourced on
      <a href="https://github.com/zahrarazzaghi96/Z-World-Clock" target="_blank"
        >GitHub</a
      >
      and is hosted on
      <a href="https://z-world-clock.netlify.app/" target="_blank">Netlify</a>
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
